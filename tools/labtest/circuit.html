<!doctype html>
<html><head><meta charset="utf-8"><title>Circuit Lab test page</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--panel:rgba(10,14,26,.78);--line:rgba(255,255,255,.12);--text:#e8ecf5;--dim:#98a2b8;--accent:#6ee7ff;--gold:#ffd166}
html,body{margin:0;height:100%;background:#05070f;color:var(--text);font-family:Inter,system-ui,sans-serif}
#hdr{height:48px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);font:600 15px 'Space Grotesk',sans-serif;box-sizing:border-box}
#host{position:relative;height:calc(100% - 48px)}
</style></head><body>
<div id="hdr">Circuit Lab (test host) &nbsp;<span style="color:var(--dim);font-weight:400">?preset=rc_charging</span></div>
<div id="host"></div>
<script src="../../js/labs/circuit.js"></script>
<script>
LABS.circuit.presetUrl = '../../data/labs/circuit_presets.json';
const id = new URLSearchParams(location.search).get('preset') || undefined;
window.lab = LABS.circuit.open(document.getElementById('host'), id);
</script></body></html>
