<!DOCTYPE html><html><head><meta charset="utf-8"><title>Viz test</title>
<style>body{background:#0a0e17;color:#e8ecf5;font:13px Inter,sans-serif;margin:16px}#g{display:grid;grid-template-columns:repeat(auto-fill,340px);gap:14px}.c{background:rgba(10,14,26,.8);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px}.c h4{margin:0 0 6px;font-size:12px;color:#6ee7ff}
.vz{position:relative;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);padding:4px}.vz canvas{display:block;width:100%}.vzc{display:flex;flex-wrap:wrap;gap:4px 10px;padding:4px}.vzc label{display:flex;gap:6px;font-size:11px;color:#98a2b8;flex:1 1 140px}.vzc input{flex:1;min-width:60px}.vzc b{color:#fff;font-size:11px}.vzr{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:#98a2b8}.vzr b{color:#ffd166}.vzcap{font-size:11.5px;color:#c5cde0;padding:4px}.vzp{font-size:11px}</style></head>
<body><div id="g"></div><script src="../../../js/viz.js"></script>
<script>
const q = new URLSearchParams(location.search), file = q.get('file') || 'samples.json', from = +(q.get('from') || 0), n = +(q.get('n') || 24);
fetch('../../../data/viz/' + file).then(r => r.json()).then(m => { const ids = q.get('ids') ? q.get('ids').split(',') : Object.keys(m).slice(from, from + n); ids.forEach(id => { const c = document.createElement('div'); c.className = 'c'; c.innerHTML = '<h4>' + id + ' · ' + m[id].type + '</h4>'; document.getElementById('g').appendChild(c); try { renderViz(c, m[id], { id }); } catch (e) { (window.VIZ_ERRORS = window.VIZ_ERRORS || []).push(id + ': ' + e.message); } }); window.VIZ_DONE = ids.length; });
</script></body></html>
